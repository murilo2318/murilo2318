    <text x="852" y="264" text-anchor="end" class="updated">atualizado mai 2026</text>
    <rect x="48" y="283" width="804" height="10" fill="#29342d" />
    <rect class="bar-segment" style="animation-delay:90ms" x="48.00" y="283" width="782.91" height="10" fill="#3572a5" /><rect class="bar-segment" style="animation-delay:145ms" x="830.91" y="283" width="21.09" height="10" fill="#5c7f8c" />
    <circle cx="52" cy="312" r="4" fill="#3572a5" /><text x="63" y="316" class="legend">Python 97%</text><circle cx="210" cy="312" r="4" fill="#5c7f8c" /><text x="221" y="316" class="legend">Dockerfile 3%</text>
    <line x1="48" y1="331" x2="852" y2="331" stroke="#344239" />
  </g>
  <g>
    <text x="48" y="340" class="eyebrow">IOT &amp; TELEMETRIA</text>
    <text x="48" y="368" class="project">UrbanSense 2.0</text>
    <text x="360" y="368" class="summary">ESP32 · sensores ambientais · MQTT</text>
    <text x="852" y="368" text-anchor="end" class="updated">atualizado mai 2026</text>
    <rect x="48" y="387" width="804" height="10" fill="#29342d" />
    <rect class="bar-segment" style="animation-delay:180ms" x="48.00" y="387" width="804.00" height="10" fill="#f34b7d" />
    <circle cx="52" cy="416" r="4" fill="#f34b7d" /><text x="63" y="420" class="legend">C++ 100%</text>
    <line x1="48" y1="435" x2="852" y2="435" stroke="#344239" />
  </g>
