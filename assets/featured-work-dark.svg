    <text x="360" y="160" class="summary">Digital twin · alertas · recomendações de manutenção</text>
    <text x="852" y="160" text-anchor="end" class="updated">atualizado ago 2026</text>
    <rect x="48" y="179" width="804" height="10" fill="#29342d" />
    <rect class="bar-segment" style="animation-delay:0ms" x="48.00" y="179" width="804.00" height="10" fill="#3572a5" />
    <circle cx="52" cy="208" r="4" fill="#3572a5" /><text x="63" y="212" class="legend">Python 100%</text>
    <line x1="48" y1="227" x2="852" y2="227" stroke="#344239" />
  </g>
  <g>
    <text x="48" y="236" class="eyebrow">IA GENERATIVA</text>
    <text x="48" y="264" class="project">FIAP AI Chatbot</text>
